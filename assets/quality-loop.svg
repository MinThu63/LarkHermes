<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="372" viewBox="0 0 1000 372" role="img">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="371" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="36" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">The assistant measures itself</text><text x="36" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Each failed answer gets a root cause, so the next step is clear.</text><rect x="36" y="96" width="160" height="56" rx="28" fill="#2a2210" stroke="#d29922" stroke-width="1"/><text x="116" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Record</text><path d="M198 124 H222" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ar)"/><rect x="224" y="96" width="160" height="56" rx="28" fill="#2a2210" stroke="#d29922" stroke-width="1"/><text x="304" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Evaluate</text><path d="M386 124 H410" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ar)"/><rect x="412" y="96" width="160" height="56" rx="28" fill="#2a2210" stroke="#d29922" stroke-width="1"/><text x="492" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Report</text><path d="M574 124 H598" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="96" width="160" height="56" rx="28" fill="#2a2210" stroke="#d29922" stroke-width="1"/><text x="680" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Act</text><path d="M762 124 H786" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#ar)"/><rect x="788" y="96" width="160" height="56" rx="28" fill="#2a2210" stroke="#d29922" stroke-width="1"/><text x="868" y="130" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Re-measure</text><text x="36" y="196" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="2">SIX KINDS OF FAILURE</text><rect x="36" y="212" width="296" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="36" y="212" width="5" height="58" rx="2" fill="#58a6ff"/><text x="56" y="237" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Retrieval</text><text x="56" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">search missed it</text><rect x="348" y="212" width="296" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="348" y="212" width="5" height="58" rx="2" fill="#d29922"/><text x="368" y="237" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Knowledge gap</text><text x="368" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">page is missing</text><rect x="660" y="212" width="296" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="660" y="212" width="5" height="58" rx="2" fill="#a371f7"/><text x="680" y="237" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Planning</text><text x="680" y="256" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">should have searched</text><rect x="36" y="284" width="296" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="36" y="284" width="5" height="58" rx="2" fill="#3fb950"/><text x="56" y="309" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Reasoning</text><text x="56" y="328" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">found pages, did not use them</text><rect x="348" y="284" width="296" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="348" y="284" width="5" height="58" rx="2" fill="#f85149"/><text x="368" y="309" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">Hallucination</text><text x="368" y="328" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">cited something not retrieved</text><rect x="660" y="284" width="296" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="660" y="284" width="5" height="58" rx="2" fill="#8b949e"/><text x="680" y="309" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="start">System</text><text x="680" y="328" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">error or no response</text>
</svg>