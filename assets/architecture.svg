<text x="36" y="44" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">Three layers</text><text x="36" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">A simplified view. Deployment details are intentionally left out.</text><rect x="36" y="90" width="928" height="100" rx="10" fill="#0f2a4a" stroke="#58a6ff" stroke-width="1"/><text x="54" y="114" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="start" letter-spacing="2">KNOWLEDGE LAYER</text><rect x="54" y="128" width="208" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="158" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Team wiki</text><rect x="278" y="128" width="208" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="382" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Searchable local copy</text><rect x="502" y="128" width="208" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="606" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Refreshed on a schedule</text><rect x="726" y="128" width="208" height="46" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1" stroke-dasharray="5 4"/><text x="830" y="156" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">More sources later</text><rect x="36" y="220" width="620" height="190" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1"/><text x="54" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#3fb950" text-anchor="start" letter-spacing="2">ASSISTANT LAYER · answers each question</text><rect x="54" y="262" width="124" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="116" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Understand</text><rect x="194" y="262" width="124" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="256" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Retrieve</text><rect x="334" y="262" width="124" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="396" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Check evidence</text><rect x="474" y="262" width="164" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="556" y="294" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Answer + sources</text><path d="M178 289 H192" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M318 289 H332" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M458 289 H472" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="54" y="336" width="584" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="346" y="369" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">Not enough evidence? Say so and suggest where to look.</text><rect x="690" y="220" width="274" height="190" rx="10" fill="#2a2210" stroke="#d29922" stroke-width="1"/><text x="708" y="244" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#d29922" text-anchor="start" letter-spacing="2">MEASUREMENT LAYER</text><text x="827" y="282" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Record outcomes</text><text x="827" y="312" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Score and classify failures</text><text x="827" y="342" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Weekly summary</text><text x="827" y="372" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">Improve content and prompts</text><path d="M346 190 V216" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><path d="M656 315 H686" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><path d="M827 220 V196 H964" fill="none"/><rect x="36" y="436" width="928" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="500" y="464" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">People ask in Lark and get cited answers</text><path d="M346 410 V432" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/>
