<text x="36" y="42" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">Keeping answers current</text><rect x="36" y="68" width="160" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="116" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Scheduled run</text><text x="116" y="117" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">daily</text><path d="M198 101 H222" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="224" y="68" width="160" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="304" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Walk the wiki</text><text x="304" y="117" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">every page</text><path d="M386 101 H410" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="412" y="68" width="160" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="492" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Pick up changes</text><text x="492" y="117" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">new or edited only</text><path d="M574 101 H598" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="600" y="68" width="160" height="66" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="680" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Extract text</text><text x="680" y="117" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">titles, sections, body</text><path d="M762 101 H786" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ar)"/><rect x="788" y="68" width="160" height="66" rx="10" fill="#0f2a4a" stroke="#58a6ff" stroke-width="1"/><text x="868" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Searchable copy</text><text x="868" y="117" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">with page links</text><text x="36" y="172" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">If a refresh comes back empty, the last good copy is kept and an alert is raised.</text>
</svg>